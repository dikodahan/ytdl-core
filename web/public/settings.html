<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ytdl-core — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <nav class="topnav">
          <a href="/">Extract</a>
          <a href="/settings.html" aria-current="page">Settings</a>
        </nav>
        <p class="brand">ytdl-core</p>
        <h1>API settings</h1>
        <p class="lede">
          Create Bearer tokens for the HTTP API. Secrets are shown once; only a hash is stored on disk.
        </p>
      </header>

      <main class="settings-layout">
        <section class="panel">
          <h2>Create token</h2>
          <form id="create-form">
            <label class="field">
              <span>Name</span>
              <input id="token-name" type="text" placeholder="e.g. home-assistant" maxlength="80" required />
            </label>
            <div class="actions">
              <button type="submit">Generate API token</button>
            </div>
          </form>

          <div id="created" class="summary empty" hidden></div>
          <p id="create-status" class="hint"></p>
        </section>

        <section class="panel">
          <h2>Active tokens</h2>
          <p id="store-path" class="hint">Loading…</p>
          <div class="table-wrap">
            <table id="tokens">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Prefix</th>
                  <th>Created</th>
                  <th>Last used</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="panel span-2">
          <h2>API usage</h2>
          <pre id="api-docs" class="codeblock"></pre>
        </section>
      </main>
    </div>
    <script src="/settings.js"></script>
  </body>
</html>
